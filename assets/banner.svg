<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <style>
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-card {
        animation: float 6s ease-in-out infinite alternate;
      }
      .scan-line {
        animation: scan 8s linear infinite;
      }
      .wave-path {
        animation: wave 10s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.98); opacity: 0.3; }
        100% { transform: scale(1.02); opacity: 0.7; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes scan {
        0% { transform: translateY(0px); }
        50% { transform: translateY(340px); }
        100% { transform: translateY(0px); }
      }
      @keyframes wave {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 200; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg)" rx="16"/>
  <rect width="1200" height="360" fill="url(#grid)" rx="16"/>

  <!-- Background Dynamic Graphic Elements (Behind Text) -->
  <!-- Glowing Background Orbs -->
  <circle cx="150" cy="90" r="140" fill="#0284c7" opacity="0.15" filter="blur(40px)"/>
  <circle cx="1050" cy="270" r="160" fill="#6366f1" opacity="0.15" filter="blur(40px)"/>
  <circle cx="900" cy="80" r="100" fill="#a855f7" opacity="0.12" filter="blur(30px)"/>

  <!-- Dynamic Wave Graphs (Subtle Background Context) -->
  <path class="wave-path" d="M 50 300 Q 200 240 350 280 T 650 260 T 950 300 T 1150 250" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 4"/>
  <path class="wave-path" d="M 50 320 Q 250 260 450 310 T 850 270 T 1150 290" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Subdued Decorative Floating Tech Pill (Right side background) -->
  <g class="float-card" transform="translate(920, 40)">
    <rect width="220" height="70" rx="12" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <circle cx="30" cy="35" r="16" fill="#06b6d4" opacity="0.2"/>
    <path d="M24 35 L36 35 M30 29 L30 41" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="32" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DICOMweb &amp; Cloud PACS</text>
    <text x="60" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">High Availability</text>
  </g>

  <!-- Subdued Floating Card Left -->
  <g class="float-card" transform="translate(60, 250)" style="animation-delay: -3s;">
    <rect width="200" height="60" rx="10" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">AWS / GCP / Azure</text>
    <text x="20" y="46" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Zero-Footprint Viewers</text>
  </g>

  <!-- Scanning Bar Background Line -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#06b6d4" stroke-width="1.5" opacity="0.3" class="scan-line"/>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges (Crisp and Unobscured) -->
  <g transform="translate(60, 110)">
    <!-- Header Badge -->
    <rect width="280" height="28" rx="14" fill="url(#accent-cyan)" />
    <text x="14" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HEALTHCARE CLOUD &amp; OPEN SOURCE</text>
    
    <!-- Main Title -->
    <text x="0" y="80" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Medical Imaging Cloud Storage &amp; API 🏥⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="118" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated Ecosystem of Enterprise Cloud PACS, DICOM APIs, &amp; Open-Source Solutions
    </text>
  </g>
</svg>
